# v0 required host gate: cargo test --workspace on every PR and every push to main.
# Rust version comes from rust-toolchain.toml (stable).
# Do not add --all-features. Do not inject RUSTFLAGS=-D warnings; the gate is cargo test.
# QEMU hello-ca (host/run-qemu.sh + tests/smoke hello-ca, guest aarch64-unknown-none,
# CID 3:7007, virtio-rng) is a later job once a guest ELF exists. Do not use
# virt,secure=on. Do not vendor OP-TEE. No TrustZone hardware.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test --workspace
        run: cargo test --workspace
