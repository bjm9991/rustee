# v0 required host gate: cargo test --workspace on every PR and every push to main.
# Rust version comes from rust-toolchain.toml (stable).
# Do not add --all-features. Do not inject RUSTFLAGS=-D warnings; the gate is cargo test.
# QEMU hello-ca (host/run-qemu.sh + tests/smoke hello-ca, guest aarch64-unknown-none,
# CID 3:7007, virtio-rng) is a later job once a guest ELF exists. Do not use
# virt,secure=on. Do not vendor OP-TEE. No TrustZone hardware.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test --workspace
        run: cargo test --workspace
  qemu-smoke:
    name: QEMU hello-ca (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and guest target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: Enable vhost-vsock
        run: |
          set -x
          sudo modprobe vhost_vsock || true
          ls -l /dev/vhost-vsock || true
          sudo chmod 0666 /dev/vhost-vsock || true
          ls -l /dev/vhost-vsock || true

      - name: Build guest ELF
        run: cargo build -p rustee-guest --features boot --target aarch64-unknown-none

      - name: Build hello-ca
        run: cargo build -p rustee-smoke --bin hello-ca

      - name: Build hello-rs.ta
        run: ./ta/hello-rs/build-ta.sh

      - name: Run QEMU hello-ca smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rustee-supp
          timeout 60s host/run-qemu.sh \
            target/aarch64-unknown-none/debug/rustee-guest &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true' EXIT
          sleep 3
          if ! kill -0 "$qemu_pid" 2>/dev/null; then
            wait "$qemu_pid"
          fi
          timeout 30s env RUSTEE_SUPP_ROOT=/tmp/rustee-supp \
            RUSTEE_HELLO_TA="$PWD/target/hello-rs.ta" \
            target/debug/hello-ca
