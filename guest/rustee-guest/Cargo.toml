[package]
name = "rustee-guest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rustee-guest"
path = "src/main.rs"
required-features = ["boot"]

[features]
default = []
boot = []

[dependencies]
rustee-hal = { workspace = true }
rustee-hal-virt = { path = "../../crates/rustee-hal-virt", features = ["allow-ree-entropy", "allow-ree-huk"] }
rustee-os = { path = "../../crates/rustee-os" }
rustee-proto = { workspace = true }
rustee-crypto = { workspace = true, features = ["allow-ree-entropy", "allow-ree-huk"] }
