[package]
name = "rustee-hal-virt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["allow-ree-entropy", "allow-ree-huk"]
allow-ree-entropy = []
allow-ree-huk = []

[dependencies]
rustee-hal = { workspace = true }

[package.metadata.rustee]
guest-target = "aarch64-unknown-none"
